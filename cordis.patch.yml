# Bundle patch: insert the plugin as a profile row.
#
# The defaults here are only seeds; the state file
# (~/.config/language-plugin-dsh/config.json) is the runtime truth and
# `/lang` writes it. Every key is optional.
- insert:
    - id: language-plugin-dsh
      name: 'language-plugin-dsh'
      config:
        chat: inherit
        artifacts: en-US
        strict: false

# The checkpoint summarizer lives inside the plugin, not in a row of its own:
# the plugin mounts it only when nothing else claims `compaction`, so a preset
# or a backend-mode jev is detected instead of crashing the boot.
#
# The stock row must still be off, or it races ours into the same service.
- id: compaction-basic
  disabled: true
