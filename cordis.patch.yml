# Bundle patch: insert the plugin as a profile row.
#
# The defaults here are only seeds; the state file
# (~/.config/language-plugin-dsh/config.json) is the runtime truth and
# `/lang` writes it. Every key is optional.
- insert:
    - id: language-plugin-dsh
      name: 'language-plugin-dsh'
      config:
        chat: inherit
        artifacts: en-US
        strict: false

# The checkpoint summarizer.
#
# The loader cannot rename a row, so the stock engine is disabled and ours is
# inserted. Ours subclasses it: range selection, replay prefix, envelope and
# usage accounting are inherited, and only the directive gains the artifact
# language. Jev-compaction stays mounted on its own row and keeps pruning
# before this runs.
- id: compaction-basic
  disabled: true

- insert:
    - id: language-compaction
      name: 'language-plugin-dsh/compaction'
